# Staging dashboard (AishaQuranAcademyDB, Stage branch) at
# staging.app.aishaquran.com, container published to 127.0.0.1:3021. Same
# same-origin API/Socket.IO proxy pattern as app.aishaquran.com.conf, just
# pointed at the staging backend (127.0.0.1:3022) instead of prod's.
#
# There is no staging build of the public site (AishaQuranAcademyFE) — the
# Finance & Payroll module never touches it. See deploy/STAGING.md.
#
# Install: copy to /etc/nginx/sites-available/staging.app.aishaquran.com,
# symlink into sites-enabled, then issue the cert:
#   certbot --nginx -d staging.app.aishaquran.com

upstream aisha_staging_dashboard {
    server 127.0.0.1:3021;
    keepalive 32;
}

upstream aisha_staging_backend {
    server 127.0.0.1:3022;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name staging.app.aishaquran.com;

    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://aisha_staging_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /socket.io/ {
        proxy_pass http://aisha_staging_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://aisha_staging_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Consider adding HTTP basic auth here (or an IP allowlist) once this
    # is live — a staging dashboard with real-looking demo data is still a
    # publicly reachable URL unless you lock it down. `htpasswd -c
    # /etc/nginx/.htpasswd-staging <user>` then `auth_basic`/
    # `auth_basic_user_file` in this block.

    # certbot --nginx will insert the `listen 443 ssl` server block and the
    # http->https redirect here automatically on first cert issuance.
}
