# Public site (AishaQuranAcademyFE) at aishaquran.com, container published
# to 127.0.0.1:3010. API and Socket.IO stay same-origin under this domain —
# the app's own code already assumes that (see the "iOS Safari blocks
# cross-site cookies" comment in lib/axios.js).
#
# Install: copy to /etc/nginx/sites-available/aishaquran.com, symlink into
# sites-enabled, then issue the cert:
#   certbot --nginx -d aishaquran.com -d www.aishaquran.com

upstream aisha_frontend {
    server 127.0.0.1:3010;
    keepalive 32;
}

upstream aisha_backend {
    server 127.0.0.1:3012;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name aishaquran.com www.aishaquran.com;

    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://aisha_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /socket.io/ {
        proxy_pass http://aisha_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://aisha_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # certbot --nginx will insert the `listen 443 ssl` server block and the
    # http->https redirect here automatically on first cert issuance.
}
