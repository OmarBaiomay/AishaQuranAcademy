# Staff/student/teacher dashboard (AishaQuranAcademyDB) at
# app.aishaquran.com, container published to 127.0.0.1:3011. Same
# same-origin API/Socket.IO proxy pattern as aishaquran.com.conf.
#
# Install: copy to /etc/nginx/sites-available/app.aishaquran.com, symlink
# into sites-enabled, then issue the cert:
#   certbot --nginx -d app.aishaquran.com -d www.app.aishaquran.com

upstream aisha_dashboard {
    server 127.0.0.1:3011;
    keepalive 32;
}

upstream aisha_backend_db {
    server 127.0.0.1:3012;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.aishaquran.com www.app.aishaquran.com;

    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://aisha_backend_db;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /socket.io/ {
        proxy_pass http://aisha_backend_db;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://aisha_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # certbot --nginx will insert the `listen 443 ssl` server block and the
    # http->https redirect here automatically on first cert issuance.
}
